# Hugo configuration file
title: N£utr0nys

enableGitInfo: true
enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true

defaultContentLanguage: en
languages:
  en:
    languageName: English
    weight: 1

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ["$$", "$$"]]
          inline: [['\(', '\)'], ["$", "$"]]
        enable: true
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Notes
      pageRef: /docs
      weight: 1
      params:
        type: link
        icon: book-open
    - name: About
      pageRef: /about
      weight: 3
      params:
        type: link
        icon: information-circle
    - name: Blog
      pageRef: /blog
      weight: 2
      params:
        type: link
        icon: pencil
    - identifier: more
      name: More
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: Theme Toggle
      weight: 6
      params:
        type: theme-toggle
        label: false
    - identifier: archives
      name: Archives
      pageRef: /archives
      parent: more
      weight: 2
      params:
        type: link
        icon: archive
    - identifier: glossary
      name: Glossary
      pageRef: /glossary
      parent: more
      weight: 3
      params:
        type: link
        icon: globe-alt
    - name: Experiences
      pageRef: /education
      parent: more
      weight: 4
      params:
        type: link
        icon: academic-cap
    - name: My CV
      pageRef: /pdf/cv.pdf
      parent: more
      weight: 5
      params:
        type: link
        icon: user

  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1
    - identifier: about
      name: "About Me"
      pageRef: "/about"
      weight: 2
    - identifier: archives
      name: "Archives"
      url: "/archives/"
      weight: 3

params:
  highlight:
    copy:
      enable: true
      # hover | always
      display: hover
  comments:
    enable: false
    type: giscus
    giscus:
      repo: <repository>
      repoId: <repository ID>
      category: <category>
      categoryId: <category ID>
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: top
  math:
    engine: mathjax

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  banner:
    key: "announcement-xxx"
    message: |
      🎉 Welcome! Enjoy your reading, and I hope you will learn something new.

  externalLinkDecoration: true
  # Search
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      tokenize: forward
  page:
    # full (100%), wide (90rem), normal (1280px)
    displayPagination: true
    width: wide
    tabs:
      sync: true
    contextMenu:
      enable: true
  imageZoom:
    enable: true
  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc # or "asc"
      # Pagination
      pagerSize: 20
    article:
      displayPagination: true
  toc:
    displayTags: true

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  navbar:
    displayTitle: true
    displayLogo: true
    width: wide

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/leoraclet/leoraclet.github.io/tree/main"

outputs:
  page: [html, markdown]
  section: [html, rss, markdown]

# hugo server --buildDrafts --disableFastRender
